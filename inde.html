<!DOCTYPE html>
<html lang="">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primavera</title>
    <link rel="stylesheet" href="estilo.css/css.css">

    <style>
        .input {
            padding: 8px;
            width: 250px;
            border: 2px solid #7c3aed;
            border-radius: 6px;
            background-color: #f5f3ff;
            color: #1e1b4b;
        }

        .input:focus {
            outline: none;
            border-color: #06b6d4;
            background-color: #ecfeff;
        }

        .label {
            display: block;
            text-align: left;
            margin-bottom: 4px;
            font-weight: bold;
            color: #312e81;
        }

        .form {
            display: inline-block;
            text-align: left;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 8px 25px rgba(76, 29, 149, 0.3);
        }

        button {
            padding: 10px 15px;
            background: linear-gradient(90deg, #7c3aed, #2563eb);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        button:hover {
            background: linear-gradient(90deg, #6d28d9, #0891b2);
        }
    </style>
</head>

<body style="
    text-align: center;
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #1e1b4b, #312e81, #1e40af);
">

    <h1 style="
        background: linear-gradient(90deg, #7c3aed, #2563eb);
        border-radius: 15px;
        display: inline-block;
        padding: 12px 24px;
        border: 2px solid #22d3ee;
        box-shadow: 0px 6px 20px rgba(34, 211, 238, 0.4);
        margin-bottom: 12px;
        color: #ffffff;
    ">
        Reservas de Clientes 🤝
    </h1>

    <div style="
        border: 3px solid #22d3ee;
        background: linear-gradient(145deg, #eef2ff, #ddd6fe);
        padding: 15px;
        max-width: 400px;
        margin: 0 auto;
        border-radius: 20px;
        box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.35);
    ">

        <h4 style="
            background: linear-gradient(90deg, #4c1d95, #1d4ed8);
            border-radius: 10px;
            display: inline-block;
            padding: 12px 24px;
            border: 2px solid #a78bfa;
            box-shadow: 0px 6px 15px rgba(76, 29, 149, 0.4);
            margin-bottom: 20px;
            color: #67e8f9;
        ">
            CADASTRO DO CLIENTE
        </h4>

        <form class="form" action="salvar_cliente.php" method="post">

            <label class="label" for="nome">Nome Completo</label>
            <input class="input" type="text" id="nome" name="nome" placeholder="Digite seu Nome" required>
            <br><br>

            <label class="label" for="email">Email</label>
            <input class="input" type="email" id="email" name="email" placeholder="Digite seu Email" required>
            <br><br>

            <label class="label" for="telefone">Telefone</label>
            <input class="input" type="number" id="telefone" name="telefone" placeholder="Digite seu telefone" required>
            <br><br>

            <label class="label" for="senha">Senha</label>
            <input class="input" type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
            <br><br>

            <button type="submit">ENVIAR CADASTRO</button>

            <br>
        </form>

    </div>

</body>

</html>
