<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do Cliente</title>
    <link rel="stylesheet" href="estilo.css/stylee.css">
    <style>
        body {
            text-align: center;

            background: linear-gradient(135deg, #1e1b4b, #312e81, #1e40af);
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .caixa-login {

            background: linear-gradient(145deg, #eef2ff, #ddd6fe);
            border: 3px solid #22d3ee;
            padding: 30px;
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
            margin: 20px auto;
            text-align: center;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.35);
            box-sizing: border-box;
        }

        .caixa-login input {
            margin-top: 8px;
            padding: 10px;
            width: 90%;

            border: 2px solid #7c3aed;
            border-radius: 6px;
            box-sizing: border-box;
            background-color: #f5f3ff;
            color: #1e1b4b;
        }

        .caixa-login input:focus {
            outline: none;
            border-color: #06b6d4;
            background-color: #ecfeff;
        }

        .caixa-login button {

            background: linear-gradient(90deg, #7c3aed, #2563eb);
            color: white;
            font-weight: bold;
            font-size: 16px;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 95%;
            margin-top: 15px;
            transition: background 0.3s ease;
        }

        .caixa-login button:hover {
            background: linear-gradient(90deg, #6d28d9, #0891b2);
        }

        .caixa-login a {

            color: #4c1d95;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: color 0.3s;
        }

        .caixa-login a:hover {
            color: #2563eb;
        }
    </style>
</head>

<body>


    <h1 style="
        background: linear-gradient(90deg, #7c3aed, #2563eb);
        border-radius: 15px;
        display: inline-block;
        padding: 12px 24px;
        border: 2px solid #22d3ee;
        box-shadow: 0px 6px 20px rgba(34, 211, 238, 0.4);
        margin-bottom: 5px;
        color: #ffffff;
    ">
        HotelSystem
    </h1>

    <h2 style="color: #67e8f9; margin-top: 0; text-shadow: 1px 1px 3px rgba(0,0,0,0.5);">Hotel</h2>

    <div class="caixa-login">

        <form action="autenticar.php" method="post">


            <h5 style="color: #312e81; margin: 10px 0; text-align: left; padding-left: 5%;">
                <label for="email">DIGITE SEU E-MAIL:</label><br>
                <input type="email" name="email" id="email" placeholder="Seu email" required>
            </h5>

            <h5 style="color: #312e81; margin: 10px 0; text-align: left; padding-left: 5%;">
                <label for="senha">DIGITE SUA SENHA:</label><br>
                <input type="password" name="senha" id="senha" placeholder="Sua senha" required>
            </h5>

            <button type="submit">Enviar</button>

            <br><br>

            <a href="inde.html">Clique aqui para ir para a tela de cadastro</a>

        </form>
    </div>

</body>

</html>
