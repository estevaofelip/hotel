<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do Cliente</title>
</head>

<body
    style="text-align: center; background-color: rgb(11, 11, 10); border: 26px solid gold; margin: 0; min-height: 100vh; box-sizing: border-box; font-family: Arial, sans-serif;">
    
    <h1 style="color: white; margin-bottom: 0;">HotelSystemy</h1>
    <h1 style="color: gold; margin-top: 5px;">Hotel</h1>

    
    <div
        style="background-color: #ffffff; padding: 30px; border-radius: 10px; max-width: 400px; margin: 20px auto; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.7);">

        <form action="" method="post">

            <h5 style="color: #333333;">
                <label for="email">DIGITE SEU GMAIL:</label><br>
                <input type="email" name="email" id="email" style="margin-top: 8px; padding: 8px; width: 90%; border: 1px solid #ccc; border-radius: 4px;">
            </h5>
            
            <h5 style="color: #333333;">
                <label for="senha">DIGITE SUA SENHA:</label><br>
                <input type="password" name="senha" id="senha" style="margin-top: 8px; padding: 8px; width: 90%; border: 1px solid #ccc; border-radius: 4px;">
            </h5>

            
            <button type="submit" style="background-color: gold; color: black; font-weight: bold; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; width: 95%; margin-top: 10px;">Enviar</button>
            
            <br><br>
            
            
            <a href="inde.html" style="color: #B22222; text-decoration: none; font-size: 14px;">Clique aqui para ir para a tela de cadastro</a>
            
        </form>

    </div>

</body>

</html>
